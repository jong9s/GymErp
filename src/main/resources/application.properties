spring.application.name=GymErp

# 포트 번호 설정
server.port=9000

# === 데이터베이스(Oracle) 설정 ===
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
# 접속 정보는 환경변수로 주입 (README의 실행 방법 참고)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521:xe}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 로컬 전용 설정(선택): application-local.properties 를 만들어 두면 함께 로딩됨
spring.config.import=optional:classpath:application-local.properties

# === MyBatis 설정 ===
# 매퍼 XML 파일 위치 (resources/mapper/*.xml)
mybatis.mapper-locations=classpath*:mapper/**/*.xml

# @Alias 등이 선언된 클래스 패키지 (하위 패키지까지 스캔)
mybatis.type-aliases-package=com.example.gymerp.**

# 컬럼명 스네이크케이스 → 필드 카멜케이스 자동 매핑 (ex: EMP_NAME -> empName)
mybatis.configuration.map-underscore-to-camel-case=true

# 콘솔에 실행되는 SQL 로그 출력 (디버깅용)
#mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# === 파일 업로드 제한 ===
# 개별 파일의 최대 크기
spring.servlet.multipart.max-file-size=50MB
# 요청 전체의 최대 크기(파일 + 폼 필드 포함)
spring.servlet.multipart.max-request-size=60MB

#-----------------11월11일 추가------------------------
# Nginx의 X-Forwarded-* 반영(https 인식)
server.forward-headers-strategy=framework

# 세션 쿠키를 https에서만/동일 도메인에서 작동
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
#---------------------------------------------------


# === 캐시 (Caffeine, 로컬 메모리) ===
# - dashboardKpi: 홈 화면 진입마다 4개 테이블을 집계하던 것을 60초 단위로 재사용
# - logCount: 로그 목록의 전체 건수(COUNT) - 페이지 이동마다 100만 건을 다시 세지 않도록 필터 조합별 캐시
# 최대 60초까지 이전 값이 보일 수 있음 (실시간 정확도보다 조회 비용을 우선한 선택)
spring.cache.cache-names=dashboardKpi,logCount
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=60s

# ================시간대 영국에서 한국으로 변환되게 수정함 ===============
spring.jackson.time-zone=Asia/Seoul




# ====================== 로그 정책 ======================

logging.level.root=INFO
logging.level.org.mybatis=WARN
logging.level.org.mybatis.spring=WARN
logging.level.org.apache.ibatis=WARN
logging.level.org.springframework.jdbc.core=INFO
logging.level.org.springframework.transaction=INFO




